server:
  port: 8083

spring:
  application:
    name: ProductService

 
  datasource:
    url: jdbc:mysql://localhost:3306/btmproductsdb?createDatabaseIfNotExist=true
    username: root
    password: admin

  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.MySQLDialect

 
  data:
    redis:
      host: localhost
      port: 6379

  
  boot:
    admin:
      client:
        url: http://localhost:1111
        instance:
          service-base-url: http://localhost:8083


eureka:
  instance:
    prefer-ip-address: true
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/


management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
      access: read-only


logging:
  level:
    org.springframework: INFO
    com.btm: DEBUG


jwt:
  secret: ${JWT_SECRET:357638792F423F4428472B4B6250655368566D597133743677397A2443264629}
  expiration: 86400000
