server:
  port: 8080

spring:
  application:
    name: ApiGateway
  boot:
    admin:
      client:
        url: http://localhost:1111   # Admin Server
        instance:
          prefer-ip: true

  main:
    web-application-type: reactive

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 60000

  cloud:
    gateway:
      httpclient:
        connect-timeout: 10000
        response-timeout: 30s

      routes:
        - id: auth-service
          uri: lb://AUTHENTICATIONSERVICE
          predicates:
            - Path=/auth/**

        - id: user-service
          uri: lb://USERSERVICE
          predicates:
            - Path=/users/**

        - id: product-service
          uri: lb://PRODUCT-SERVICE
          predicates:
            - Path=/api/products/**,/api/categories/**
        - id: kart-service
          uri: lb://kartservice
          predicates:
            - Path=/cart/**
         

      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods: "*"
            allowedHeaders: "*"

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

jwt:
  secret: ${JWT_SECRET:357638792F423F4428472B4B6250655368566D597133743677397A2443264629}
  expiration: 86400000
