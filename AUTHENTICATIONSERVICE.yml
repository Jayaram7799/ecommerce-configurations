server:
  port: 8082

spring:
  application:
    name: AUTHENTICATIONSERVICE

  datasource:
    url: jdbc:mysql://localhost:3306/BtmAuthUser?createDatabaseIfNotExist=true
    username: root
    password: admin

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  boot:
    admin:
      client:
        url: http://localhost:1111
        instance:
          service-base-url: http://localhost:8082
         

management:
  endpoints:
    web:
      exposure:
        include: "*"

  endpoint:
    health:
      show-details: always

eureka:
  instance:
     prefer-ip-adress: true
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
    

  

jwt:
  secret: ${JWT_SECRET:357638792F423F4428472B4B6250655368566D597133743677397A2443264629}
  expiration: 86400000
