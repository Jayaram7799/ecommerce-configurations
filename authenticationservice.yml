server:
  port: 8082

spring:
  application:
    name: authenticationservice

  datasource:
    url: jdbc:mysql://localhost:3306/BtmAuthUser?createDatabaseIfNotExist=true
    username: root
    password: admin

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  boot:
    admin:
      client:
        url: http://localhost:1111
        instance:
          service-base-url: http://authenticationservice:8082
          prefer-ip: false

management:
  endpoints:
    web:
      exposure:
        include: "*"

  endpoint:
    health:
      show-details: always

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
    register-with-eureka: true
    fetch-registry: true

  instance:
    hostname: authenticationservice
    prefer-ip-address: false

jwt:
  secret: ${JWT_SECRET:357638792F423F4428472B4B6250655368566D597133743677397A2443264629}
  expiration: 86400000
